services:
  cowrie:
    image: cowrie/cowrie@sha256:99dc2531f317b0d1a44feccd1cdd2a5ec8fc456b31cb0ed59e7bed1a35dbd345
    container_name: cowrie
    restart: unless-stopped
    ports:
      - "22:2222"
    volumes:
      - ./cowrie/etc/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/etc/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - cowrie-log:/cowrie/cowrie-git/var/log/cowrie
      - cowrie-dl:/cowrie/cowrie-git/var/lib/cowrie/downloads
    networks:
      - traps

  webtrap:
    build: ./webtrap
    container_name: webtrap
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - webtrap-log:/var/log/webtrap
    mem_limit: 64m
    networks:
      - traps

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    mem_limit: 300m
    networks:
      - internal

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7.1.0
    container_name: geoipupdate
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: 72
    volumes:
      - geoip-data:/usr/share/GeoIP
    mem_limit: 50m
    networks:
      - internal

  alloy:
    image: grafana/alloy:v1.8.0
    container_name: alloy
    restart: unless-stopped
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - cowrie-log:/var/log/cowrie:ro
      - webtrap-log:/var/log/webtrap:ro
      - alloy-data:/var/lib/alloy/data
      - geoip-data:/etc/geoip:ro
    mem_limit: 200m
    depends_on:
      - loki
      - geoipupdate
    networks:
      - internal

  grafana:
    image: grafana/grafana-oss:12.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 250m
    depends_on:
      - loki
    networks:
      - internal

  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.8
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/linux"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./crowdsec/acquis-cowrie.yaml:/etc/crowdsec/acquis.d/cowrie.yaml:ro
      - ./crowdsec/parser-cowrie-raw.yaml:/etc/crowdsec/parsers/s00-raw/osv-cowrie-raw.yaml:ro
      - ./crowdsec/parser-cowrie.yaml:/etc/crowdsec/parsers/s01-parse/osv-cowrie-logs.yaml:ro
      - ./crowdsec/whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/osv-whitelist.yaml:ro
      - ./crowdsec/scenario-cowrie.yaml:/etc/crowdsec/scenarios/osv-cowrie-login.yaml:ro
      - cowrie-log:/var/log/cowrie:ro
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
    mem_limit: 150m
    networks:
      - internal

  bot:
    build: ./bot
    container_name: telegram-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      SPIKE_THRESHOLD: 50
      DIGEST_TIME: "20:00"
      LOKI_URL: http://loki:3100
    volumes:
      - cowrie-log:/var/log/cowrie:ro
      - geoip-data:/etc/geoip:ro
    mem_limit: 64m
    networks:
      - internal

volumes:
  cowrie-log:
  cowrie-dl:
  webtrap-log:
  loki-data:
  alloy-data:
  grafana-data:
  geoip-data:
  crowdsec-db:
  crowdsec-config:

networks:
  traps:
  internal:
